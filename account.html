<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | The Curl Co</title>
<meta name="description" content="Sign in to your Curl Co account to track orders, manage your wishlist and routine.">
<link rel="canonical" href="https://thecurlco.in/account">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div id="site-header-slot"></div>

<main>
<section class="section">
  <div class="container" style="max-width:880px">
    <h1>My Account</h1>
    <div class="checkout-grid">
      <form class="checkout-step" data-form>
        <h3>Sign in</h3>
        <div class="field"><label>Email</label><input type="email" required></div>
        <div class="field"><label>Password</label><input type="password" required></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
        <p style="margin-top:14px"><a href="#">Forgot password?</a></p>
      </form>
      <form class="checkout-step" data-form>
        <h3>Create account</h3>
        <div class="field"><label>Full name</label><input required></div>
        <div class="field"><label>Email</label><input type="email" required></div>
        <div class="field"><label>Password</label><input type="password" required></div>
        <button class="btn btn-secondary btn-lg btn-block" type="submit">Create account</button>
      </form>
    </div>
    <div class="checkout-step" id="wishlist" style="margin-top:32px">
      <h3>My wishlist</h3>
      <p class="muted">Hearts you've added across the site.</p>
      <div class="product-grid" id="wishlist-grid"></div>
    </div>
  </div>
</section>
</main>

<div id="site-footer-slot"></div>
<script src="assets/js/partials.js" defer></script>
<script src="assets/js/cart.js" defer></script>
<script src="assets/js/products.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  await window.CurlcoRender.loadAll();
  const ids = JSON.parse(localStorage.getItem('curlco_wish_v1')||'[]');
  const list = window.CurlcoProducts.all.filter(p=>ids.includes(p.id));
  const grid = document.getElementById('wishlist-grid');
  if(!list.length){ grid.innerHTML='<p class="muted" style="padding:18px 0">No items in wishlist yet.</p>'; return; }
  window.CurlcoRender.renderInto('#wishlist-grid', list);
});
</script>
</body></html>
