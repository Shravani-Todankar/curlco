<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Curl Edit — Blog — The Curl Co.</title>
  <meta name="description" content="Tips, tutorials, and curl love from The Curl Co. Wash day routines, frizz science, curl type guides, and more.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <section class="page-hero">
    <div class="breadcrumb"><a href="index.html">Home</a> / Blog</div>
    <h1>The Curl Edit</h1>
    <p>Tips, tutorials, and curl love — from us to you.</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="blog-filters" id="blog-filters">
        <button class="blog-pill active" data-cat="all">All</button>
        <button class="blog-pill" data-cat="curl-care">Curl Care</button>
        <button class="blog-pill" data-cat="tutorials">Tutorials</button>
        <button class="blog-pill" data-cat="science">Curl Science</button>
        <button class="blog-pill" data-cat="lifestyle">Lifestyle</button>
      </div>
      <div class="blog-grid" id="blog-grid"></div>
    </div>
  </section>

  <div data-include="footer"></div>

  <script>
    const BLOGS = [
      { id:1, cat:'curl-care', catLabel:'Curl Care', title:"How to Build a Wash Day Routine That Actually Works", excerpt:"From pre-poo to plopping — the ten steps every Indian curly girl should know, in the right order.", read:'7 min read',
        img:"https://thecurlco.in/cdn/shop/files/1_e889aa24-4aaa-41a2-8e43-9e71bbccd735.png?crop=center&height=685&v=1776323544&width=625" },
      { id:2, cat:'tutorials', catLabel:'Tutorials', title:"Plopping vs Diffusing: Which Works for Indian Hair?", excerpt:"We tested both techniques on humid Mumbai mornings. Here's what actually held up past noon.", read:'5 min read',
        img:"https://thecurlco.in/cdn/shop/files/3_d94d3d2b-8fbe-4cdc-a6e1-0fa570d48f19.png?crop=center&height=685&v=1776324037&width=625" },
      { id:3, cat:'science', catLabel:'Curl Science', title:"The Science of Frizz — Why Humidity Hates Your Hair", excerpt:"It's not your hair, it's hydrogen bonds. A no-jargon explainer on why your curls poof — and how to stop it.", read:'6 min read',
        img:"https://thecurlco.in/cdn/shop/files/6_0eea5043-c5be-4b84-853d-769339875136.png?crop=center&height=685&v=1776324160&width=625" },
      { id:4, cat:'lifestyle', catLabel:'Lifestyle', title:"Curl Type 101: Find Your Pattern in 60 Seconds", excerpt:"2A or 3B? Here's the quickest field guide to identifying your curl pattern — without overthinking it.", read:'4 min read',
        img:"https://thecurlco.in/cdn/shop/files/5_2a3e1e4e-4847-4678-84d2-30245d40df83.png?crop=center&height=685&v=1776323696&width=625" }
    ];

    function renderBlogs(cat){
      const list = cat === 'all' ? BLOGS : BLOGS.filter(b => b.cat === cat);
      qs('#blog-grid').innerHTML = list.map(b => `
        <article class="blog-card">
          <a class="blog-cover" href="#"><img src="${b.img}" alt="${b.title}" loading="lazy"></a>
          <div class="blog-body">
            <span class="blog-cat">${b.catLabel}</span>
            <h3>${b.title}</h3>
            <p class="excerpt">${b.excerpt}</p>
            <div class="blog-meta">
              <span class="read-time">${b.read}</span>
              <a class="read-more" href="#">Read More →</a>
            </div>
          </div>
        </article>`).join('');
    }

    function onPageReady(){
      renderBlogs('all');
      qsa('.blog-pill').forEach(p => p.addEventListener('click', () => {
        qsa('.blog-pill').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        renderBlogs(p.dataset.cat);
      }));
    }
  </script>
</body>
</html>
