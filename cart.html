<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — The Curl Co.</title>
  <meta name="description" content="Review your curl care order and check out.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <section class="page-hero">
    <div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>
    <h1>Your Curl Cart</h1>
  </section>

  <div id="cart-page">
    <div id="cart-empty" style="text-align:center; padding:80px 24px; display:none;">
      <div style="font-size:64px;">🌀</div>
      <h2 style="margin:16px 0;">Your cart is empty</h2>
      <p style="margin-bottom:24px; color:var(--walnut-mid);">Your curls are waiting for some love.</p>
      <a class="btn btn-primary btn-lg" href="all-products.html">Shop Now</a>
    </div>

    <div class="cart-layout" id="cart-layout" style="display:none;">
      <div class="cart-table" id="cart-table-body"></div>
      <aside class="summary-card">
        <h3>Order Summary</h3>
        <div style="margin-bottom:18px;">
          <div style="height:6px; background:var(--cream-border); border-radius:100px; overflow:hidden; margin-bottom:8px;">
            <div id="cart-ship-fill" style="height:100%; background:var(--terracotta); border-radius:100px; transition:width 0.3s; width:0%;"></div>
          </div>
          <p style="font-size:12px; color:var(--walnut-mid);" id="cart-ship-note">Add ₹499 more for free shipping</p>
        </div>
        <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="cart-shipping">₹50</span></div>
        <div class="summary-divider"></div>
        <div class="summary-total"><span>Total</span><span id="cart-total">₹0</span></div>
        <a class="btn btn-primary btn-lg" href="checkout.html" style="width:100%; justify-content:center; margin-top:8px;">Proceed to Checkout →</a>
        <div class="summary-trust">
          <span>🔒 Secure</span>
          <span>🔄 Returns</span>
          <span>📦 COD</span>
        </div>
      </aside>
    </div>
  </div>

  <div data-include="footer"></div>
</body>
</html>
