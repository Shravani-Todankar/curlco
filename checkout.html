<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — The Curl Co.</title>
  <meta name="description" content="Secure checkout for The Curl Co. orders.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <section class="page-hero">
    <div class="breadcrumb"><a href="cart.html">Cart</a> / Checkout</div>
    <h1>Checkout</h1>
  </section>

  <div class="checkout-layout">
    <div class="checkout-form">
      <div class="progress-steps">
        <div class="pstep active" data-step="1"><span class="pnum">1</span> Delivery</div>
        <div class="pstep" data-step="2"><span class="pnum">2</span> Payment</div>
        <div class="pstep" data-step="3"><span class="pnum">3</span> Review</div>
      </div>

      <!-- Step 1 -->
      <section class="form-section" id="step-1">
        <h3>Contact & Delivery</h3>
        <div class="form-grid">
          <div class="form-field"><label>Full Name</label><input type="text" id="f-name" required></div>
          <div class="form-field"><label>Email</label><input type="email" id="f-email" required></div>
          <div class="form-field full"><label>Phone</label><input type="tel" id="f-phone" required pattern="[0-9]{10}"></div>
          <div class="form-field full"><label>Address Line 1</label><input type="text" id="f-addr" required></div>
          <div class="form-field"><label>City</label><input type="text" id="f-city" required></div>
          <div class="form-field"><label>State</label><input type="text" id="f-state" required></div>
          <div class="form-field"><label>Pincode</label><input type="text" id="f-pin" required pattern="[0-9]{6}"></div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%; justify-content:center; margin-top:20px;" onclick="goStep(2)">Continue to Payment →</button>
      </section>

      <!-- Step 2 -->
      <section class="form-section" id="step-2" style="display:none;">
        <h3>Payment</h3>
        <div class="payment-options">
          <label class="pay-option selected" data-pay="upi">
            <input type="radio" name="pay" value="upi" checked>
            <div>
              <div class="pay-label">UPI</div>
              <div class="pay-sub">Pay via any UPI app (GPay, PhonePe, Paytm)</div>
            </div>
          </label>
          <div class="pay-details" id="upi-details">
            <div class="form-field"><label>UPI ID</label><input type="text" placeholder="yourname@upi" id="upi-id"></div>
          </div>

          <label class="pay-option" data-pay="card">
            <input type="radio" name="pay" value="card">
            <div>
              <div class="pay-label">Credit / Debit Card</div>
              <div class="pay-sub">Visa, Mastercard, Rupay accepted</div>
            </div>
          </label>
          <div class="pay-details" id="card-details">
            <div class="form-grid">
              <div class="form-field full"><label>Card Number</label><input type="text" placeholder="•••• •••• •••• ••••" maxlength="19"></div>
              <div class="form-field full"><label>Name on Card</label><input type="text"></div>
              <div class="form-field"><label>Expiry</label><input type="text" placeholder="MM/YY" maxlength="5"></div>
              <div class="form-field"><label>CVV</label><input type="text" maxlength="3"></div>
            </div>
          </div>

          <label class="pay-option" data-pay="cod">
            <input type="radio" name="pay" value="cod">
            <div>
              <div class="pay-label">Cash on Delivery</div>
              <div class="pay-sub">Pay when your order arrives</div>
            </div>
          </label>
        </div>
        <button class="btn btn-outline btn-sm" onclick="goStep(1)" style="margin-right:8px;">← Back</button>
        <button class="btn btn-primary btn-lg" style="margin-top:8px;" onclick="goStep(3)">Review Order →</button>
      </section>

      <!-- Step 3 -->
      <section class="form-section" id="step-3" style="display:none;">
        <h3>Review Your Order</h3>
        <div class="review-block" id="rev-address"></div>
        <div class="review-block" id="rev-payment"></div>
        <div class="review-block" id="rev-items"></div>
        <button class="btn btn-outline btn-sm" onclick="goStep(2)" style="margin-right:8px;">← Back</button>
        <button class="btn btn-primary btn-lg" style="margin-top:8px;" onclick="placeOrder()">Place Order</button>
      </section>

      <div class="checkout-trust">
        <span>🔒 Secure Checkout</span>
        <span>🔄 Easy Returns</span>
        <span>📦 COD Available</span>
        <span>🇮🇳 Made in India</span>
      </div>
    </div>

    <aside class="summary-card" style="height:fit-content;">
      <h3>Order Summary</h3>
      <div id="checkout-items"></div>
      <div class="summary-divider"></div>
      <div class="summary-row"><span>Subtotal</span><span id="co-sub">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span id="co-ship">Free</span></div>
      <div class="summary-divider"></div>
      <div class="summary-total"><span>Total</span><span id="co-total">₹0</span></div>
    </aside>
  </div>

  <div data-include="footer"></div>

  <script>
    let currentStep = 1;

    function goStep(n){
      // Validate step 1
      if (n > 1 && currentStep === 1) {
        const required = ['#f-name','#f-email','#f-phone','#f-addr','#f-city','#f-state','#f-pin'];
        for (let sel of required) {
          const el = qs(sel);
          if (!el.value.trim()) { el.focus(); el.style.borderColor = 'var(--error)'; showToast('Please fill all delivery fields'); return; }
          el.style.borderColor = '';
        }
      }
      currentStep = n;
      qsa('.pstep').forEach(s => {
        const step = parseInt(s.dataset.step);
        s.classList.remove('active','done');
        if (step < n) s.classList.add('done');
        else if (step === n) s.classList.add('active');
      });
      qsa('.form-section').forEach((sec,i) => sec.style.display = (i+1 === n) ? 'block' : 'none');
      if (n === 3) buildReview();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function buildReview(){
      qs('#rev-address').innerHTML = `<strong>Shipping to</strong>${qs('#f-name').value}<br>${qs('#f-addr').value}, ${qs('#f-city').value}, ${qs('#f-state').value} – ${qs('#f-pin').value}<br>📞 ${qs('#f-phone').value} · ✉ ${qs('#f-email').value}`;
      const pay = document.querySelector('input[name="pay"]:checked').value;
      const map = { upi:'UPI', card:'Credit / Debit Card', cod:'Cash on Delivery' };
      qs('#rev-payment').innerHTML = `<strong>Payment Method</strong>${map[pay]}`;
      const items = getCart();
      qs('#rev-items').innerHTML = `<strong>Items</strong>` + items.map(i => `• ${i.name} × ${i.qty} — ${formatPrice(i.price * i.qty)}`).join('<br>');
    }

    function renderCheckoutSummary(){
      const items = getCart();
      qs('#checkout-items').innerHTML = items.map(it => `
        <div class="summary-item">
          <img src="${it.img}" alt="${it.name}">
          <div>
            <div class="si-name">${it.name}</div>
            <div class="si-qty">Qty: ${it.qty}</div>
          </div>
          <div class="si-price">${formatPrice(it.price * it.qty)}</div>
        </div>`).join('');
      const sub = getCartSubtotal();
      const ship = sub >= FREE_SHIP ? 0 : 50;
      qs('#co-sub').textContent = formatPrice(sub);
      qs('#co-ship').textContent = ship === 0 ? 'Free' : formatPrice(ship);
      qs('#co-total').textContent = formatPrice(sub + ship);
    }

    function placeOrder(){
      const items = getCart();
      if (items.length === 0) { showToast('Your cart is empty'); window.location.href = 'all-products.html'; return; }
      const sub = getCartSubtotal();
      const ship = sub >= FREE_SHIP ? 0 : 50;
      const orderId = '#TCC-' + Math.floor(10000 + Math.random() * 90000);
      const snapshot = {
        items,
        subtotal: sub,
        shipping: ship,
        total: sub + ship,
        address: { name: qs('#f-name').value, addr: qs('#f-addr').value, city: qs('#f-city').value, state: qs('#f-state').value, pin: qs('#f-pin').value, phone: qs('#f-phone').value, email: qs('#f-email').value },
        payment: document.querySelector('input[name="pay"]:checked').value,
        orderId
      };
      sessionStorage.setItem('tcc_last_order', JSON.stringify(snapshot));
      clearCart();
      window.location.href = 'thank-you.html';
    }

    function onPageReady(){
      if (getCart().length === 0) { window.location.href = 'cart.html'; return; }
      renderCheckoutSummary();
      qsa('.pay-option').forEach(opt => opt.addEventListener('click', () => {
        qsa('.pay-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input[type=radio]').checked = true;
      }));
    }
  </script>
</body>
</html>
