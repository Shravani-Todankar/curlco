<body>
<div id="site-header-slot"></div>

<main>

    <p>Sulphate-free, silicone-free formulas made in India for 2A through 4A curls.</p>

</section>

<section class="section">
  <div class="container">
    <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span>Shop</nav>
    <div class="shop-layout">
      <aside class="filters" aria-label="Filters">
        <h5>Curl type</h5>
        <label><input type="checkbox" class="f-curl" value="2a"> 2A waves</label>
        <label><input type="checkbox" class="f-curl" value="2b"> 2B waves</label>
        <label><input type="checkbox" class="f-curl" value="2c"> 2C waves</label>
        <label><input type="checkbox" class="f-curl" value="3a"> 3A loose curls</label>

        <label><input type="checkbox" class="f-curl" value="3c"> 3C tight curls</label>
        <label><input type="checkbox" class="f-curl" value="4a"> 4A coils</label>

        <h5>Concern</h5>
        <label><input type="checkbox" class="f-concern" value="frizz"> Frizz</label>
        <label><input type="checkbox" class="f-concern" value="definition"> Definition</label>
        <label><input type="checkbox" class="f-concern" value="moisture"> Moisture</label>

        <label><input type="checkbox" class="f-cat" value="conditioner"> Conditioner</label>
        <label><input type="checkbox" class="f-cat" value="styler"> Cream & Gel</label>

        <label><input type="checkbox" class="f-cat" value="accessory"> Accessory</label>

        <label><input type="radio" name="rating" class="f-rating" value="0" checked> All</label>
        <label><input type="radio" name="rating" class="f-rating" value="4"> 4★ & up</label>
        <label><input type="radio" name="rating" class="f-rating" value="4.5"> 4.5★ & up</label>
      </aside>

      <div>
        <div class="shop-head">
          <span id="shop-count" class="muted">Loading…</span>
          <select id="shop-sort">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price low to high</option>
            <option value="price-desc">Price high to low</option>
            <option value="rating">Top rated</option>
            <option value="new">Newest</option>

          <button>Curl type</button><button>Concern</button><button>Category</button><button>Rating</button>
