<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed! — The Curl Co.</title>
  <meta name="description" content="Thanks for your order. Your curls are going to love this.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <div class="thanks-wrap">
    <div id="confetti-host"></div>
    <div class="thanks-check">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Your Curls Are Going to Love This! 🌀</h1>
    <p class="thanks-sub">Order confirmed! Tracking link coming to your WhatsApp & email.</p>
    <div class="thanks-order-id" id="thanks-order-id">#TCC-00000</div>
    <span class="thanks-eta">📦 Estimated delivery: 3–5 business days</span>

    <div class="thanks-items" id="thanks-items"></div>

    <div class="thanks-ctas">
      <a class="btn btn-primary btn-lg" href="all-products.html">Continue Shopping →</a>
      <a class="btn btn-outline btn-lg" href="how-to-use.html">Watch How-To Tutorials →</a>
      <a class="btn btn-wa btn-lg" href="https://wa.me/919082643562" target="_blank" rel="noopener">Track on WhatsApp →</a>
    </div>

    <p class="thanks-cta-foot">Love your new curls? Tag us <a href="https://www.instagram.com/thecurlcoindia/" target="_blank" rel="noopener">@thecurlcoindia 💛</a></p>
  </div>

  <div data-include="footer"></div>

  <script>
    function spawnConfetti(){
      const host = qs('#confetti-host');
      const colors = ['var(--terracotta)','var(--gold)','var(--walnut)','var(--cream-deep)'];
      for (let i = 0; i < 20; i++) {
        const c = document.createElement('span');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[i % colors.length];
        c.style.animationDelay = (Math.random() * 3) + 's';
        c.style.animationDuration = (3 + Math.random() * 3) + 's';
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = c.style.width;
        host.appendChild(c);
      }
    }

    function onPageReady(){
      spawnConfetti();
      let order = null;
      try { order = JSON.parse(sessionStorage.getItem('tcc_last_order')); } catch(e) {}
      if (order) {
        qs('#thanks-order-id').textContent = 'Order ' + order.orderId;
        qs('#thanks-items').innerHTML = `
          <h3 style="font-size:18px; margin-bottom:14px;">Order Items</h3>
          ${order.items.map(it => `
            <div class="summary-item">
              <img src="${it.img}" alt="${it.name}">
              <div>
                <div class="si-name">${it.name}</div>
                <div class="si-qty">Qty: ${it.qty}</div>
              </div>
              <div class="si-price">${formatPrice(it.price * it.qty)}</div>
            </div>`).join('')}
          <div class="summary-divider"></div>
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${order.shipping === 0 ? 'Free' : formatPrice(order.shipping)}</span></div>
          <div class="summary-total"><span>Total Paid</span><span>${formatPrice(order.total)}</span></div>
        `;
      } else {
        qs('#thanks-order-id').textContent = '#TCC-' + Math.floor(10000 + Math.random() * 90000);
        qs('#thanks-items').innerHTML = `<p style="text-align:center; color:var(--walnut-mid);">Order placed successfully! Details are on their way to your email.</p>`;
      }
    }
  </script>
</body>
</html>
