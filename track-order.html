<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Order | The Curl Co</title>
<meta name="description" content="Track your Curl Co order with your order ID and email.">
<link rel="canonical" href="https://thecurlco.in/pages/track-order">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div id="site-header-slot"></div>

<main>
<section class="section">
  <div class="container" style="max-width:640px">
    <h1>Track your order</h1>
    <p class="muted">Enter your order ID and email — we'll show you the latest status.</p>
    <form class="checkout-step" data-form>
      <div class="field"><label>Order ID</label><input placeholder="TCC-2024-XXXXX" required></div>
      <div class="field"><label>Email</label><input type="email" required></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Track</button>
    </form>
    <div class="checkout-step" style="margin-top:24px">
      <h3>Order status</h3>
      <ol style="padding-left:20px;line-height:2">
        <li>✅ Order placed · 12 May 2026, 11:42 IST</li>
        <li>✅ Payment confirmed · 12 May 2026, 11:43 IST</li>
        <li>⏳ Packing in Mumbai warehouse</li>
        <li>⬜ Shipped via Delhivery</li>
        <li>⬜ Out for delivery</li>
        <li>⬜ Delivered</li>
      </ol>
    </div>
  </div>
</section>
</main>

<div id="site-footer-slot"></div>
<script src="assets/js/partials.js" defer></script>
<script src="assets/js/cart.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body></html>
